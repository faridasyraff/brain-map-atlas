# CI: runs on every push and pull request.
#
#   lint       ruff (pyflakes + pycodestyle errors + bugbear; see pyproject.toml)
#   test       pytest. The database unit tests run here; the HTTP smoke tests
#              need a running app with the ~500 MB atlas download, so they
#              skip themselves in CI — run them locally with the app up.
#   frontend   TypeScript type check, Vitest unit tests, production build
#   docker     builds the image (after the checks above pass)
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the older, now-irrelevant run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check --output-format=github .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest

  frontend:
    name: Frontend (types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Type check (TypeScript)
        run: npm run typecheck
        working-directory: frontend
      - name: Unit tests (Vitest)
        run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [lint, test, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t brain-map-atlas-app .
