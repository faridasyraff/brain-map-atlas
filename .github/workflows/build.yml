# Runs on every push and pull request. Fast checks that need no atlas data;
# the HTTP smoke tests (backend/tests/test_api_smoke.py) need a running app
# with the ~500 MB atlas download, so run those locally.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Static checks (undefined names, unused imports)
        run: |
          pip install pyflakes==3.2.0
          python -m pyflakes backend/*.py backend/tests/*.py
      - name: Database unit tests
        run: python -m unittest backend.tests.test_db -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t brain-map-atlas-app .
