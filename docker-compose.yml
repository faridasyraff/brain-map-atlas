services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - backend/.env
    # Lets the container reach Ollama running on your computer at
    # http://host.docker.internal:11434 (built in on Docker Desktop; this
    # line makes it work on Linux too).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # These three lines create permanent storage folders on your computer
      # that live outside the container. Without them, every time you stop
      # and restart the app it would forget everything and re-download the
      # ~500MB of brain atlas data + mesh files from scratch. With them, that
      # data is saved between restarts, so only the very first start is slow.
      - atlas-data:/app/backend/data
      - atlas-meshes:/app/backend/meshes
      - atlas-logs:/app/backend/logs
      # No need to run voxelize_meshes.py yourself: on first start the app
      # generates meshes_volume.npy/.json in the background (~7 minutes,
      # progress in logs/voxelize.log) and saves it into atlas-data above,
      # so later restarts reuse it. Everything except clicking inside the 3D
      # eBrain view works while it's being made.

volumes:
  atlas-data:
  atlas-meshes:
  atlas-logs:
