openapi: 3.0.3

info:
  title: Kim Brain Atlas Interface — API Documentation
  description: |
    REST API for the Allen CCFv3 Mouse Brain Atlas web application.
    Built with Flask (Python). Provides brain slice rendering, region lookup,
    semantic search, hierarchy navigation, region highlighting, and AI chatbot endpoints.

    **Group 216 — Penn State University**
    - Muhammad Danish Zahin Bin Rafizal
    - Alif Danial Bin Kamarole Erifin
    - Muhammad Farid Asyraf Mohd Shahimi

    **Client:** Dr. Yongsoo Kim, Ph.D — Department of Neuroscience, Penn State College of Medicine

    **Total Endpoints:** 18
  version: 1.0.0
  contact:
    name: Group 216
    email: group216@psu.edu

servers:
  - url: http://localhost:5000
    description: Local development server

tags:
  - name: Visualization
    description: Brain slice rendering and image endpoints
  - name: Region Lookup
    description: Identify brain regions from pixel coordinates
  - name: Search
    description: Semantic and name-based region search
  - name: Highlight
    description: Generate highlight masks for regions and groups
  - name: Navigation
    description: Region centroid and hierarchy navigation
  - name: Chatbot
    description: AI-powered brain region question answering
  - name: Ontology
    description: Allen Brain Atlas ontology tree
  - name: Debug
    description: Developer debug utilities

paths:

  # ─────────────────────────────────────────────────────────────────────────
  # VISUALIZATION
  # ─────────────────────────────────────────────────────────────────────────

  /:
    get:
      tags: [Visualization]
      summary: Serve frontend application
      description: |
        Returns the main index.html single-page application. This is the
        entry point for the browser-based atlas interface.
      responses:
        '200':
          description: HTML page served successfully

  /api/slice:
    get:
      tags: [Visualization]
      summary: Get a rendered brain atlas slice image
      description: |
        Renders a 2D cross-section of the Allen CCFv3 brain atlas volume
        as a base64-encoded PNG image. Supports three orthogonal views
        (sagittal, coronal, transverse) and optional colour overlays using
        the official Allen Brain Atlas colour table.

        The slice index is clamped to the valid range for the selected view
        so out-of-range values never cause errors.
      parameters:
        - name: view
          in: query
          required: false
          schema:
            type: string
            enum: [sagittal, coronal, transverse]
            default: sagittal
          description: The anatomical plane to slice along
        - name: idx
          in: query
          required: false
          schema:
            type: integer
          description: Slice index along the selected axis. Defaults to midpoint.
        - name: colorize
          in: query
          required: false
          schema:
            type: string
            enum: [off, structure, substructure, division, organ, category]
            default: off
          description: Colour overlay level using the Allen Brain Atlas colour table
      responses:
        '200':
          description: Slice rendered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  image:
                    type: string
                    description: Base64-encoded PNG with data URI prefix
                    example: "data:image/png;base64,iVBORw0KGgo..."
                  view:
                    type: string
                    example: sagittal
                  idx:
                    type: integer
                    example: 660
                  rows:
                    type: integer
                    description: Atlas array height in voxels
                  cols:
                    type: integer
                    description: Atlas array width in voxels
                  render_w:
                    type: integer
                    description: Rendered PNG width in pixels
                  render_h:
                    type: integer
                    description: Rendered PNG height in pixels
        '400':
          description: Invalid view or idx parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/log_warning:
    post:
      tags: [Visualization]
      summary: Log a rapid-click warning from the frontend
      description: |
        Called by the frontend when its client-side rapid-click spam detector
        fires. Writes a WARNING entry to the server log file so developers
        can monitor excessive click patterns.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  description: Type of rapid event
                  example: click
                label:
                  type: string
                  description: Region or group name that was rapidly clicked
                  example: Caudoputamen
                count:
                  type: integer
                  description: Number of rapid requests detected
                  example: 5
      responses:
        '200':
          description: Warning logged successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true

  # ─────────────────────────────────────────────────────────────────────────
  # REGION LOOKUP
  # ─────────────────────────────────────────────────────────────────────────

  /api/lookup:
    post:
      tags: [Region Lookup]
      summary: Look up brain region at a clicked pixel coordinate
      description: |
        Given a pixel position (col, row) on a rendered slice image, returns
        the brain region at that location including its name at all hierarchy
        levels (organ → category → division → structure → substructure),
        official atlas colours, acronyms, and 3D world coordinates (xi, yi, zi).

        This is the core endpoint called every time a user clicks on the atlas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [view, idx, col, row]
              properties:
                view:
                  type: string
                  enum: [sagittal, coronal, transverse]
                  example: sagittal
                idx:
                  type: integer
                  description: Slice index
                  example: 660
                col:
                  type: integer
                  description: Pixel column (x) on the rendered image
                  example: 320
                row:
                  type: integer
                  description: Pixel row (y) on the rendered image
                  example: 240
      responses:
        '200':
          description: Region identified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionInfo'
        '400':
          description: Missing or invalid parameters, or coordinates out of bounds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ─────────────────────────────────────────────────────────────────────────
  # HIGHLIGHT
  # ─────────────────────────────────────────────────────────────────────────

  /api/highlight:
    post:
      tags: [Highlight]
      summary: Generate a highlight mask for a single region
      description: |
        Returns an RGBA PNG mask that highlights a specific brain region
        with a coloured semi-transparent fill and thick black outline.
        The mask is overlaid on top of the rendered slice image in the browser.

        In colour mode (color_mode=true) a fixed purple colour is used so
        the highlight stands out over the colourized atlas overlay.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [view, idx, parcellation_index]
              properties:
                view:
                  type: string
                  enum: [sagittal, coronal, transverse]
                idx:
                  type: integer
                parcellation_index:
                  type: integer
                  description: Parcellation index of the region to highlight
                  example: 662
                level:
                  type: string
                  enum: [organ, category, division, structure, substructure]
                  default: structure
                  description: Hierarchy level for colour selection
                color_mode:
                  type: boolean
                  default: false
                  description: If true uses purple regardless of region colour
      responses:
        '200':
          description: Highlight mask generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  mask:
                    type: string
                    description: Base64-encoded RGBA PNG mask with data URI prefix
                  color:
                    type: string
                    description: Hex colour used for the highlight
                    example: "#FF6600"
        '400':
          description: Missing or invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/highlight_indices:
    post:
      tags: [Highlight]
      summary: Generate a highlight mask for multiple region indices
      description: |
        Returns an RGBA PNG mask highlighting all regions whose parcellation
        indices are in the provided list. Used when a search returns multiple
        matching regions that should all be highlighted simultaneously.
        All highlighted regions use the same muted dark purple colour.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [view, idx, parcellation_indices]
              properties:
                view:
                  type: string
                  enum: [sagittal, coronal, transverse]
                idx:
                  type: integer
                parcellation_indices:
                  type: array
                  items:
                    type: integer
                  description: List of parcellation indices to highlight
                  example: [662, 382, 549]
      responses:
        '200':
          description: Highlight mask generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  mask:
                    type: string
                    description: Base64-encoded RGBA PNG mask
                  color:
                    type: string
                    example: "#6c34c4"
                  member_count:
                    type: integer
                    description: Number of indices that were highlighted
        '400':
          description: Missing or invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/highlight_group:
    post:
      tags: [Highlight]
      summary: Highlight all regions in an anatomical group
      description: |
        Highlights all parcellation indices whose value at a given hierarchy
        level matches the specified group name. For example, passing
        group_level="division" and group_name="Striatum" highlights every
        region that belongs to the Striatum division.

        Renders a semi-transparent purple fill with bright boundary lines
        so internal region separations remain visible.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [view, idx, group_level, group_name]
              properties:
                view:
                  type: string
                  enum: [sagittal, coronal, transverse]
                idx:
                  type: integer
                group_level:
                  type: string
                  enum: [organ, category, division, structure, substructure]
                  description: Which hierarchy column to match against
                group_name:
                  type: string
                  description: Name of the group to highlight
                  example: Striatum
      responses:
        '200':
          description: Group highlight mask generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  mask:
                    type: string
                    description: Base64-encoded RGBA PNG mask
                  color:
                    type: string
                    example: "#6c34c4"
                  member_count:
                    type: integer
        '400':
          description: Missing or invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No regions found for the specified group

  # ─────────────────────────────────────────────────────────────────────────
  # SEARCH
  # ─────────────────────────────────────────────────────────────────────────

  /api/search:
    get:
      tags: [Search]
      summary: Search brain regions by name, acronym, or function
      description: |
        Two-tier semantic search returning both GROUP matches (entire
        anatomical groups like "Striatum") and LEAF matches (individual
        regions like "Caudoputamen"). Groups are always ranked above leaves.

        Supports prefix matching on both names and acronyms. Groups with
        only one member are demoted to leaf results.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query — region name, acronym, or keyword
          example: hippocampus
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 200
          description: Maximum number of results to return
      responses:
        '200':
          description: Search results returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/SearchResult'
                  query:
                    type: string
                  total:
                    type: integer

  /api/resolve_region:
    get:
      tags: [Search]
      summary: Find the single best matching region for a name
      description: |
        Dedicated endpoint for the semantic region parser used by the AI
        chatbot. Tries seven matching strategies in priority order:
          1. Exact group name match
          2. Exact acronym match
          3. Exact leaf name match on any hierarchy column
          4. Term-tree node exact name or acronym match
          5. Prefix match on group names (≥5 chars)
          6. Prefix match on leaf names (≥5 chars)
          7. Substring match covering >45% of leaf name (≥5 chars)

        Returns one result object or an empty object if no match is found.
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
            minLength: 2
          description: Region name or acronym to resolve
          example: hippocampus
      responses:
        '200':
          description: Best matching region found (or empty object if no match)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SearchResult'
                  - type: object
                    description: Empty object — no match found

  # ─────────────────────────────────────────────────────────────────────────
  # NAVIGATION
  # ─────────────────────────────────────────────────────────────────────────

  /api/region_center:
    post:
      tags: [Navigation]
      summary: Get the best slice indices for viewing a single region
      description: |
        Finds all voxels of a brain region in the 3D annotation volume and
        returns the slice index for each view (sagittal, coronal, transverse)
        that contains the most voxels. This guarantees the highlight will
        be visible even for elongated structures where the centroid slice
        may contain very few voxels.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parcellation_index]
              properties:
                parcellation_index:
                  type: integer
                  example: 662
      responses:
        '200':
          description: Region centroid found successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  parcellation_index:
                    type: integer
                  xi:
                    type: integer
                    description: Best sagittal slice index
                  yi:
                    type: integer
                    description: Best transverse slice index
                  zi:
                    type: integer
                    description: Best coronal slice index
                  voxel_count:
                    type: integer
                    description: Total number of voxels in this region
        '400':
          description: parcellation_index field is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No voxels found for this parcellation index

  /api/region_center_group:
    post:
      tags: [Navigation]
      summary: Get the best slice indices for viewing an anatomical group
      description: |
        Finds the combined voxel distribution of all regions belonging to
        an anatomical group and returns the best slice indices for each
        view. Also returns the representative colour for the group and
        the total voxel count.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group_level, group_name]
              properties:
                group_level:
                  type: string
                  enum: [organ, category, division, structure, substructure]
                group_name:
                  type: string
                  example: Striatum
      responses:
        '200':
          description: Group centroid found successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  xi:
                    type: integer
                  yi:
                    type: integer
                  zi:
                    type: integer
                  voxel_count:
                    type: integer
                  member_count:
                    type: integer
                  group_level:
                    type: string
                  group_name:
                    type: string
                  structure_color:
                    type: string
        '400':
          description: Missing or invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No regions or voxels found for this group

  /api/region_center_indices:
    post:
      tags: [Navigation]
      summary: Get the best slice indices for a list of parcellation indices
      description: |
        Similar to /api/region_center but accepts a list of parcellation
        indices rather than a single one. Finds all voxels belonging to
        any of the provided indices and returns the best slice index for
        each view based on the combined voxel distribution.

        Useful when navigating to a group of regions identified by the
        term tree or search results.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parcellation_indices]
              properties:
                parcellation_indices:
                  type: array
                  items:
                    type: integer
                  description: List of parcellation indices to find the center for
                  example: [662, 382, 549]
      responses:
        '200':
          description: Center indices found successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  xi:
                    type: integer
                    description: Best sagittal slice index
                  yi:
                    type: integer
                    description: Best transverse slice index
                  zi:
                    type: integer
                    description: Best coronal slice index
                  voxel_count:
                    type: integer
                    description: Total voxels across all provided indices
                  member_count:
                    type: integer
                    description: Number of indices provided
        '400':
          description: parcellation_indices field is missing, invalid, or empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No voxels found for any of the provided indices

  /api/group_by_term:
    post:
      tags: [Navigation]
      summary: Get all parcellation indices under an Allen ontology term
      description: |
        Uses the Allen CCFv3 term tree (parcellation_term.csv) to collect
        all leaf parcellation indices under a named term. Works for container
        nodes like "Cerebrum" or "Vermal regions" that do not appear as
        direct parcellation indices in the annotation volume but have many
        child regions beneath them.

        This is the ground-truth grouping path for the Allen ontology.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Term name to look up in the Allen ontology
                  example: Cerebrum
                acronym:
                  type: string
                  description: Term acronym (alternative to name)
                  example: CH
      responses:
        '200':
          description: Term found and indices collected successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  term_id:
                    type: string
                    description: Allen CCFv3 term label string
                  name:
                    type: string
                  acronym:
                    type: string
                  index_count:
                    type: integer
                    description: Number of leaf parcellation indices found
                  parcellation_indices:
                    type: array
                    items:
                      type: integer
        '404':
          description: Term not found in ontology or no voxels found

  /api/find_group_level:
    post:
      tags: [Navigation]
      summary: Find which hierarchy level a name belongs to
      description: |
        Given a region or group name, determines which hierarchy level
        (organ, category, division, structure, or substructure) it belongs
        to so the frontend can route to the correct group endpoint.

        Returns the group level, the canonical group name as it appears
        in the atlas, and the number of member regions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Region or group name to find
                  example: Striatum
      responses:
        '200':
          description: Group level found successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  group_level:
                    type: string
                    example: division
                  group_name:
                    type: string
                    example: Striatum
                  member_count:
                    type: integer
        '400':
          description: name field is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Name not found in any hierarchy level

  /api/resolve_acronyms:
    post:
      tags: [Navigation]
      summary: Resolve a list of acronyms to parcellation indices
      description: |
        Accepts a list of acronym strings and returns the corresponding
        parcellation indices. Used for Allen tree container nodes
        (e.g. "Cerebrum", "CNU") that are referenced by acronym in the
        frontend ontology tree but need integer indices for highlighting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                acronyms:
                  type: array
                  items:
                    type: string
                  description: List of acronym strings to resolve
                  example: [CP, HPF, CB]
      responses:
        '200':
          description: Acronyms resolved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  parcellation_indices:
                    type: array
                    items:
                      type: integer
                    description: Matched parcellation indices
                  count:
                    type: integer
                    description: Number of indices found

  # ─────────────────────────────────────────────────────────────────────────
  # ONTOLOGY
  # ─────────────────────────────────────────────────────────────────────────

  /api/ontology:
    get:
      tags: [Ontology]
      summary: Get the full Allen Brain Atlas ontology tree
      description: |
        Fetches the complete Allen CCFv3 mouse brain structure hierarchy
        tree from the Allen Brain Map API (api.brain-map.org), enriches
        each node with the official atlas colour from the local colour
        table, and returns the full JSON tree.

        The result is cached in memory after the first request so
        subsequent calls are instant and do not hit the Allen API again.
      responses:
        '200':
          description: Ontology tree returned successfully
          content:
            application/json:
              schema:
                type: object
                description: Full Allen Brain Atlas structure graph JSON with _color fields injected
        '502':
          description: Failed to fetch ontology from the Allen Brain Map API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ─────────────────────────────────────────────────────────────────────────
  # CHATBOT
  # ─────────────────────────────────────────────────────────────────────────

  /api/chat:
    post:
      tags: [Chatbot]
      summary: Ask the AI chatbot a question about a brain region
      description: |
        AI-powered question answering endpoint. Routes to either:

        **Ollama (local RAG) — default:**
          1. Searches CortexMap for live PubMed research summaries
          2. Falls back to local brain_regions_kb.json if CortexMap unavailable
          3. Runs inference via local Ollama (gemma3:4b model)
          4. Returns source PMC IDs for frontend link rendering

        **OpenAI GPT:**
          - Uses GPT-4o-mini with rich region context from atlas data frames
          - Requires OPENAI_API_KEY in environment or .env file
          - No RAG — uses GPT's own neuroscience knowledge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  description: The question to ask
                  example: What does the hippocampus do?
                region_name:
                  type: string
                  description: Name of the currently selected region
                  example: Hippocampal formation
                region_acronym:
                  type: string
                  description: Acronym of the selected region
                  example: HPF
                parcellation_index:
                  type: integer
                  description: Parcellation index of the selected region
                  example: 382
                ai_provider:
                  type: string
                  enum: [ollama, openai]
                  default: ollama
                  description: Which AI provider to use
      responses:
        '200':
          description: Answer generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer:
                    type: string
                    description: The AI-generated answer text
                  provider:
                    type: string
                    enum: [ollama, openai]
                  cortexmap_status:
                    type: string
                    description: Status of CortexMap data enrichment (Ollama only)
                    enum:
                      - enriched
                      - local_only
                      - unreachable
                      - region_not_found
                      - generating
                      - summaries_error
                      - no_summaries
                      - error
                  cortexmap_notice:
                    type: string
                    nullable: true
                    description: Human-readable notice about which data source was used
                  pmc_sources:
                    type: array
                    items:
                      type: string
                    description: PMC IDs of source papers for frontend link rendering
                    example: ["PMC1234567", "PMC7654321"]
        '400':
          description: Message field is empty or missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error — AI model failure or timeout

  # ─────────────────────────────────────────────────────────────────────────
  # DEBUG
  # ─────────────────────────────────────────────────────────────────────────

  /api/debug_name:
    get:
      tags: [Debug]
      summary: Debug search across name_df columns
      description: |
        Developer debug endpoint. Searches all hierarchy columns
        (organ, category, division, structure, substructure) in the
        name_df metadata table for any value containing the query string.

        Returns up to 20 matching values per column and up to 10 exact
        match rows with full hierarchy information. Used during development
        to verify that region names are correctly loaded from the atlas
        metadata files.

        **Note:** This endpoint is intended for developer use only and
        is not called by the production frontend.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Partial or full region name to search for
          example: hippocampus
      responses:
        '200':
          description: Search results returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  organ:
                    type: array
                    items:
                      type: string
                    description: Matching values found in the organ column
                  category:
                    type: array
                    items:
                      type: string
                  division:
                    type: array
                    items:
                      type: string
                  structure:
                    type: array
                    items:
                      type: string
                  substructure:
                    type: array
                    items:
                      type: string
                  _exact_rows:
                    type: array
                    description: Up to 10 rows with exact name match
                    items:
                      type: object
                      properties:
                        parcellation_index:
                          type: integer
                        organ:
                          type: string
                        category:
                          type: string
                        division:
                          type: string
                        structure:
                          type: string
                        substructure:
                          type: string

# ─────────────────────────────────────────────────────────────────────────────
# REUSABLE SCHEMAS
# ─────────────────────────────────────────────────────────────────────────────

components:
  schemas:

    Error:
      type: object
      description: Standard error response body
      properties:
        error:
          type: string
          description: Human-readable error message
      example:
        error: "view, idx, col, row required"

    RegionInfo:
      type: object
      description: Full region information returned by /api/lookup
      properties:
        view:
          type: string
          example: sagittal
        idx:
          type: integer
          example: 660
        col:
          type: integer
        row:
          type: integer
        xi:
          type: integer
          description: Atlas x-coordinate (anterior-posterior axis)
        yi:
          type: integer
          description: Atlas y-coordinate (superior-inferior axis)
        zi:
          type: integer
          description: Atlas z-coordinate (left-right axis)
        parcellation_index:
          type: integer
          example: 662
        organ:
          type: string
          example: brain
        category:
          type: string
          example: Basic cell groups and regions
        division:
          type: string
          example: Striatum
        structure:
          type: string
          example: Caudoputamen
        substructure:
          type: string
          example: Caudoputamen
        matched_label:
          type: string
          description: Most specific non-empty name at any hierarchy level
          example: Caudoputamen
        matched_acronym:
          type: string
          example: CP
        organ_color:
          type: string
          description: Official Allen Atlas hex colour for the organ level
          example: "#FF6600"
        category_color:
          type: string
        division_color:
          type: string
        structure_color:
          type: string
        substructure_color:
          type: string

    SearchResult:
      type: object
      description: A single result from /api/search or /api/resolve_region
      properties:
        is_group:
          type: boolean
          description: True if this is an anatomical group, false if a leaf region
        parcellation_index:
          type: integer
        matched_label:
          type: string
        matched_acronym:
          type: string
        matched_level:
          type: string
          description: Which hierarchy level the match was found at
        structure_color:
          type: string
        organ:
          type: string
        category:
          type: string
        division:
          type: string
        structure:
          type: string
        substructure:
          type: string
        no_voxels:
          type: boolean
          description: True if this region has no annotated voxels in the CCFv3 volume
        group_level:
          type: string
          description: Only present when is_group is true
        group_name:
          type: string
          description: Only present when is_group is true
        group_acronym:
          type: string
          description: Only present when is_group is true
        member_count:
          type: integer
          description: Only present when is_group is true
